name: Refresh official tide forecasts
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/update_tides.py', '.github/workflows/refresh-tides.yml']
permissions:
  contents: write
concurrency:
  group: refresh-tides
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate CWA public forecast tables
        run: python scripts/update_tides.py
      - name: Commit refreshed data for the public raw data endpoint
        run: |
          if git diff --quiet -- data/tides.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tides.json
          git commit -m 'Refresh official CWA tide forecasts'
          git push
